<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've Been Challenged! | Word Search</title>
    <meta name="theme-color" content="#FF4081">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Word Search Challenge">
    <meta property="og:description"
        content="Can you beat my time? Install the Word Search game to play this unique puzzle!">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://drew-developer.github.io/wordsearch/assets/social_preview.png">

    <style>
        :root {
            --sunset-purple: #9C27B0;
            --sunset-pink: #FF4081;
            --sunset-orange: #FF9800;
            --dark-bg: #1A1A2E;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: #2E2E4E;
                --text-main: #FFFFFF;
                --text-sub: #BDBDBD;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--sunset-purple), var(--sunset-pink), var(--sunset-orange));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 32px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 380px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1), float 6s ease-in-out infinite;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            overflow: hidden;
            background-color: white;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 32px;
            line-height: 1.6;
            font-size: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 14px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            font-size: 17px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--sunset-pink), var(--sunset-orange));
            color: white;
            box-shadow: 0 8px 25px rgba(255, 64, 129, 0.3);
        }

        .btn-secondary {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary {
                background-color: rgba(255, 255, 255, 0.1);
            }
        }

        .badge {
            background-color: rgba(255, 152, 0, 0.15);
            color: var(--sunset-orange);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="card">
        <div class="logo-container">
            <img src="../assets/icon.webp" alt="Word Search Logo">
        </div>
        <div class="badge" id="difficulty-badge">CHALLENGE</div>
        <h1>Word Search</h1>
        <p>You've been challenged to beat a high score on this unique puzzle seed!</p>

        <a href="#" id="open-app-btn" class="btn btn-primary">Try to Beat Me</a>
        <a href="https://play.google.com/store/apps/details?id=io.github.drew_developer.wordsearch"
            class="btn btn-secondary">Get the App</a>
    </div>

    <script>
        // Parse Query Params
        const params = new URLSearchParams(window.location.search);
        const seed = params.get('seed') || '';
        const difficulty = params.get('difficulty') || 'MEDIUM';

        // Update UI
        if (params.get('difficulty')) {
            document.getElementById('difficulty-badge').innerText = difficulty + " DIFFICULTY";
        }

        // Deep Link Logic
        const openAppBtn = document.getElementById('open-app-btn');
        const playStoreUrl = "https://play.google.com/store/apps/details?id=io.github.drew_developer.wordsearch";

        // Use Intent URI for Android (more robust than custom schemes alone)
        const intentUri = `intent://challenge?seed=${seed}&difficulty=${difficulty}#Intent;scheme=wordsearch-challenge;package=io.github.drew_developer.wordsearch;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
        const customScheme = `wordsearch-challenge://challenge?seed=${seed}&difficulty=${difficulty}`;

        // Select best target based on platform
        const isAndroid = /Android/i.test(navigator.userAgent);
        const appLink = isAndroid ? intentUri : customScheme;

        openAppBtn.href = appLink;

        // Auto-redirect attempt (gentle)
        window.onload = function () {
            if (isAndroid && seed) {
                // For Android, standard practice is to use the intent URI
                // but only if we have a seed to actually play.
                setTimeout(() => {
                    window.location.href = intentUri;
                }, 500);
            }
        };
    </script>
</body>

</html>
